name: Deploy admin portal to Azure

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin-portals
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    environment: bmftest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore admin portal
        run: dotnet restore BMF.WebCore.Admin/BMF.WebCore.Admin.csproj

      - name: Publish admin portal
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP 'bmf-admin-publish'
          Copy-Item 'BMF.WebCore.Admin\appsettings.example.json' 'BMF.WebCore.Admin\appsettings.json' -Force
          dotnet publish BMF.WebCore.Admin/BMF.WebCore.Admin.csproj --configuration Release --no-restore --output $publishPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Exclude configuration from bmfadmin package
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP 'bmf-admin-publish'
          Get-ChildItem -LiteralPath $publishPath -Filter 'appsettings*.json' -File |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName }

      - name: Release bmfadmin file locks for deployment
        id: bmfadmin_offline
        shell: pwsh
        run: |
          $token = az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0) { throw 'Could not authenticate to the deployment endpoint.' }
          $headers = @{ Authorization = "Bearer $token"; 'If-None-Match' = '*' }
          Invoke-WebRequest -Method Put -Uri 'https://bmfadmin.scm.azurewebsites.net/api/vfs/site/wwwroot/app_offline.htm' `
            -Headers $headers -ContentType 'text/html' -Body '<html><body>Updating the admin portal. Please retry shortly.</body></html>' | Out-Null
          'created=true' >> $env:GITHUB_OUTPUT
          Start-Sleep -Seconds 10

      - name: Deploy to bmfadmin preserving existing configuration
        uses: azure/webapps-deploy@v3
        with:
          app-name: bmfadmin
          package: ${{ runner.temp }}/bmf-admin-publish
          clean: 'false'

      - name: Bring bmfadmin back online
        if: ${{ always() && steps.bmfadmin_offline.outputs.created == 'true' }}
        shell: pwsh
        run: |
          $token = az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0) { throw 'Could not authenticate to restore the admin portal.' }
          $headers = @{ Authorization = "Bearer $token"; 'If-Match' = '*' }
          Invoke-WebRequest -Method Delete -Uri 'https://bmfadmin.scm.azurewebsites.net/api/vfs/site/wwwroot/app_offline.htm' `
            -Headers $headers | Out-Null

      - name: Verify admin login page
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri 'https://bmfadmin.azurewebsites.net/LogIn' -TimeoutSec 90
          if ($response.StatusCode -ne 200 -or $response.Content -notmatch 'type=["'']password["'']') {
            throw 'bmfadmin did not return the admin login form.'
          }
          Write-Output 'bmfadmin admin login page verified.'

      - name: Verify public website remains separate
        shell: pwsh
        run: .\.github\scripts\Test-PublicWebsite.ps1 -Attempts 8
